# Catálogo único de skills y herramientas de Hefesto.
# Las skills no tienen dueño: el orquestador decide qué rol y qué modo usa cada entrada.
# Todos los commits están fijados (SHA-1 de 40 hex) y se traen con `hefesto skill sync`,
# nunca con npx ni instaladores externos.

# Impeccable v4: craft está deprecado en v4 y overdrive y hooks quedan fuera a propósito;
# init/shape/live/generate exigen un humano; detect solo como verify;
# telemetría siempre desactivada con DO_NOT_TRACK=1.
[skills.impeccable]
kind = "skill"
source = "pbakaus/impeccable"
commit = "08d5b470495d242ca0470f4aeae1956c3a074f83"
path = ".agents/skills/impeccable"
license = "Apache-2.0"
roles = ["core", "visual", "reviewer", "verify"]
kinds = ["app", "web"]
interactive = ["init", "shape", "live", "generate"]

[skills.impeccable.modes]
core = ["init", "shape", "document", "critique", "audit", "live", "generate"]
visual = [
    "document",
    "extract",
    "typeset",
    "layout",
    "colorize",
    "harden",
    "optimize",
    "adapt",
    "clarify",
    "onboard",
    "distill",
    "quieter",
    "bolder",
    "animate",
    "delight",
    "polish",
]
reviewer = ["critique", "audit"]
verify = ["detect"]

